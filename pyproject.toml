[project]
name = "binaml"
dynamic = ["version"]
description = "Continual learning models over streams of binary features"
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "Romain Zimmer" },
]
license = { file = "LICENSE" }
keywords = ["boolean-functions", "machine-learning", "online-learning", "streaming"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
benchmarks = [
    "jax>=0.4.35,<0.5; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "jax>=0.4.35; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "optax>=0.2",
    "seaborn>=0.13",
]

[project.urls]
Homepage = "https://github.com/binaml/binaml"
Repository = "https://github.com/binaml/binaml"
Issues = "https://github.com/binaml/binaml/issues"

[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "bindings/python/Cargo.toml"
python-source = "python"
module-name = "binaml._core"
features = ["extension-module"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.12",
    "jax>=0.4.35,<0.5; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "jax>=0.4.35; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "optax>=0.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100
