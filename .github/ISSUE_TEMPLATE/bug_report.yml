name: Bug report
description: Report unexpected behavior in Binaml.
title: "[bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include code, expected behavior, and actual behavior.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Binaml version
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, Python version, and Rust version when relevant.
