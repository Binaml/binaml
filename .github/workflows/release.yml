name: Release

on:
  push:
    tags:
      - v*

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      python-version: ${{ steps.version.outputs.python-version }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        name: Check tag and release metadata
        shell: bash
        run: |
          version=$(awk -F '"' '/^version =/ { print $2; exit }' Cargo.toml)
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match workspace version $version" >&2
            exit 1
          fi
          grep -F "version: \"$version\"" CITATION.cff
          grep -F "## [$version]" CHANGELOG.md
          python_version=${version/-alpha./a}
          python_version=${python_version/-beta./b}
          python_version=${python_version/-rc./rc}
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "python-version=$python_version" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    uses: ./.github/workflows/release-check.yml

  publish-core:
    needs: [version, build]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - id: crate
        name: Check whether crate version exists
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            "https://crates.io/api/v1/crates/binaml-core/$VERSION")
          if [[ "$status" == "200" ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - id: auth
        if: steps.crate.outputs.exists != 'true'
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish binaml-core
        if: steps.crate.outputs.exists != 'true'
        run: cargo publish -p binaml-core --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      - name: Verify existing binaml-core release
        if: steps.crate.outputs.exists == 'true'
        run: echo "binaml-core ${{ needs.version.outputs.version }} is already published"

  publish-python:
    needs: [version, build, publish-core]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  github-release:
    needs: [version, publish-python]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Extract changelog section
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          awk -v heading="## [$VERSION]" '
            $0 == heading { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md
      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          prerelease=()
          if [[ "$VERSION" == *-* ]]; then
            prerelease+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            "${prerelease[@]}"
