[package]
name = "boolean-circuit-exp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Streaming boolean circuit learning experiments"

[[bin]]
name = "run_exp"
path = "src/bin/run_exp.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
rand = "0.8"
rand_chacha = "0.3"
rayon = "1"

[dev-dependencies]
proptest = "1"
