<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Binaml</title>
  <desc id="desc">The letter B from the Binaml wordmark, accompanied by the pixel dots from the Binaml wordmark, rendered in a white, italic terminal-inspired pixel typeface on a black background.</desc>
